<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Digital Profile Card</title>
	<!-- Menghubungkan file HTML dengan file CSS eksternal -->
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- Kartu kontainer utama -->
	<div class="profile-card">

		<!-- Badge status aktif -->
		<span class="badge">ready to code</span>

		<!-- Foto profil -->
		<img src="https://png.pngtree.com/png-clipart/20241219/original/pngtree-muslim-boy-clipart-wear-shalwar-kameez-and-wearing-his-cap-hd-png-image_17962865.png" alt="Foto Profil" class="profile-img">

		<!-- Nama & peran -->
		<h1>Hamka Dan asrafil Tampan dan gagah</h1>
		<p class="role">UI/UX Designer & Student RPL</p>
		
		<!-- Bio / Deskripsi singkat -->
		<p class="bio">hobi saya belajar dan sholat.</p>

		<!-- Tombol Aksi / Media Sosial -->
		<div class="social-links">
			<a href="#" class="btn github">Github</a>
			<a href="#" class="btn instagram">Instagram</a>
		</div>

	</div>

</body>
</html>
